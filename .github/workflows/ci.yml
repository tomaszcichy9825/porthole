name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: cd app && npm ci
      - name: Lint
        run: cd app && CI=1 npx expo lint
      - name: Typecheck
        run: cd app && npx tsc --noEmit
      - name: Test
        run: cd app && npm test --if-present
