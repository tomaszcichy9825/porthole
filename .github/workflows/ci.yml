name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # App scaffold does not exist yet; lint/typecheck/test wired up once app/ lands.
      - name: Lint, typecheck, test
        run: |
          if [ -f app/package.json ]; then
            cd app
            npm ci
            npm run lint --if-present
            npx tsc --noEmit || true
            npm test --if-present
          else
            echo "No app yet; CI is a placeholder."
          fi
