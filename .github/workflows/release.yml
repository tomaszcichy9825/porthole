name: Release

# Pushing a vX.Y.Z tag (make release V=X.Y.Z) creates the GitHub release,
# then runs an EAS cloud build of the internal-distribution Android APK
# (preview profile) and attaches it to the release page for sideloading.
# Store submission comes later, once Play/App Store listings exist.
#
# Both jobs live in this one tag-triggered workflow because a release
# published with GITHUB_TOKEN does not fire `release:` workflows.
#
# Needs the EXPO_TOKEN repo secret; the Android keystore lives on EAS
# servers, seeded by the first interactive `eas build -p android`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes

  android:
    runs-on: ubuntu-latest
    needs: release
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --wait so the artifact URL exists for the upload step. The runner
      # idles through the cloud build; acceptable while releases are rare.
      - name: Build preview APK
        run: |
          eas build --platform android --profile preview --non-interactive --json --wait > build.json

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(jq -r '.[0].artifacts.buildUrl' build.json)
          curl -sL "$URL" -o "porthole-${GITHUB_REF_NAME}.apk"
          gh release upload "${GITHUB_REF_NAME}" "porthole-${GITHUB_REF_NAME}.apk" --clobber
